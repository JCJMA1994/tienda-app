<!DOCTYPE html>
<html lang="es">
<head>
  <!-- $FLUTTER_BASE_HREF lo reemplaza `flutter build web` (usa --base-href si la app no está en la raíz). -->
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Inventario, punto de venta y facturación electrónica para boutiques.">
  <meta name="theme-color" content="#171514">
  <meta name="robots" content="noindex">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Percha">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Percha</title>
  <!-- Estilos de la pantalla de carga: en un archivo aparte, así la CSP no necesita 'unsafe-inline' para estilos de la página. -->
  <link rel="stylesheet" href="splash.css">
</head>
<body>
  <div id="splash" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" alt="" width="72" height="72">
    <p>Cargando Percha…</p>
  </div>
  <noscript><p class="noscript">Percha necesita JavaScript activado.</p></noscript>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
